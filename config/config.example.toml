[server]
host = "127.0.0.1"
port = 7777
log_level = "info"

[auth]
enabled = true
token_file = "./config/token.txt"

[tts]
default_voice = "sherpa-en-debug"
max_chars_per_request = 4000
max_chars_per_stream = 48000
warmup_on_start = true

[streaming]
enabled = true
audio_frame_ms = 40
prebuffer_ms = 200

[metrics]
enabled = true

[security]
allowed_origins = []

[limits]
max_concurrent_jobs = 2
max_job_seconds = 300
requests_per_minute = 30
completed_job_ttl_seconds = 300
max_stored_jobs = 128

[backend]
mode = "auto"
provider = "cpu"
num_threads = 1
debug = false
max_num_sentences = 1

[reader]
enabled = true
home_path = ""
database_path = "reader.db"
managed_files_path = "library"
copy_imported_files = false
default_page_size = 50
max_page_size = 500
max_blocks_per_stream_window = 64
max_source_chars_per_stream_window = 32000
max_edit_history_operations = 1000
max_edit_history_bytes = 10485760

[reader.imports]
max_file_bytes = 52428800
max_expanded_archive_bytes = 209715200
max_archive_members = 10000
max_document_characters = 10000000
max_blocks = 250000
timeout_seconds = 60

[reader.rules]
enabled = true
default_regex_timeout_ms = 25
max_regex_pattern_chars = 2048
max_replacement_chars = 4096
max_rule_time_per_block_ms = 250
